<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dewinst.id — Peta Aplikasi (interaktif)</title>
<style>
  :root{
    --bg:#07080c; --ink:#eef0f6; --sub:#9aa0b4; --line:rgba(255,255,255,.08); --glass:rgba(18,20,28,.74);
    --master:#98989d; --pembelian:#30d158; --gudang:#ff9f0a; --penjualan:#0a84ff;
    --kasbank:#64d2ff; --bukubesar:#ffd60a; --laporan:#bf5af2; --broken:#ff453a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(1200px 700px at 70% -10%,#15203a 0%,var(--bg) 55%) fixed;color:var(--ink);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  #app{display:grid;grid-template-rows:auto 1fr;height:100%}
  header{display:flex;align-items:center;gap:18px;padding:13px 20px;border-bottom:1px solid var(--line);
         background:linear-gradient(180deg,rgba(12,14,21,.9),rgba(12,14,21,.5));backdrop-filter:blur(14px);z-index:5}
  .brand b{font-size:16px;letter-spacing:-.02em;display:block} .brand span{font-size:10.5px;color:var(--sub);letter-spacing:.06em;text-transform:uppercase}
  .stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;padding:6px 11px;text-align:center}
  .stat b{font-size:15px;display:block} .stat span{font-size:9.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em}
  .stats{display:flex;gap:10px} .grow{flex:1}
  .search{position:relative}
  .search input{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:9px 12px 9px 32px;width:200px;outline:none;font-size:13px}
  .search input:focus{border-color:rgba(10,132,255,.6);box-shadow:0 0 0 3px rgba(10,132,255,.15)}
  .search svg{position:absolute;left:10px;top:9px;opacity:.5}
  .btn{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:9px 13px;cursor:pointer;font-size:13px}
  .btn:hover{background:rgba(255,255,255,.12)}
  main{position:relative;overflow:hidden}
  #cy{position:absolute;inset:0}
  .floatbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:4;display:flex;gap:7px;padding:7px;border-radius:15px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 14px 40px rgba(0,0,0,.45)}
  .chip{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--sub);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:12.5px;font-weight:600;transition:.18s;white-space:nowrap}
  .chip:hover{color:var(--ink);background:rgba(255,255,255,.09)} .chip.on{color:#06121f;background:#fff;border-color:#fff}
  .steps{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:4;display:none;gap:5px;align-items:center;flex-wrap:wrap;max-width:78%;justify-content:center;padding:8px 13px;border-radius:13px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .steps.show{display:flex}
  .steps .st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);font-weight:500}
  .steps .num{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#fff;color:#06121f;font-size:10.5px;font-weight:800}
  .steps .arr{opacity:.35;margin:0 1px}
  .legend{position:absolute;left:14px;bottom:14px;z-index:4;background:var(--glass);border:1px solid var(--line);border-radius:15px;padding:13px 15px;backdrop-filter:blur(16px);box-shadow:0 14px 40px rgba(0,0,0,.45)}
  .legend h4{margin:0 0 9px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
  .legend .row{display:flex;align-items:center;gap:9px;margin:6px 0;font-size:12.5px;cursor:pointer;transition:.15s}
  .legend .row:hover{transform:translateX(2px)} .legend .row.off{opacity:.3;text-decoration:line-through}
  .swatch{width:12px;height:12px;border-radius:4px;flex:0 0 auto;box-shadow:0 0 9px currentColor}
  .panel{position:absolute;top:14px;right:14px;bottom:14px;width:350px;z-index:6;background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.55);transform:translateX(390px);transition:transform .32s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;overflow:hidden}
  .panel.open{transform:none}
  .panel .ph{padding:18px 18px 14px;border-bottom:1px solid var(--line);position:relative}
  .panel .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:9px}
  .panel h3{margin:0;font-size:19px;letter-spacing:-.01em} .panel .kind{color:var(--sub);font-size:12px;margin-top:3px}
  .panel .pb{padding:16px 18px;overflow-y:auto} .panel .sec{margin-bottom:15px}
  .panel .sec h5{margin:0 0 7px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
  .panel .sec p{margin:0;color:#d3d7e3;font-size:13.5px;line-height:1.55}
  .lst{display:flex;flex-wrap:wrap;gap:6px} .lst span{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:11.5px}
  .flags{display:flex;gap:7px;margin-top:2px} .flag{font-size:11px;font-weight:700;border-radius:9px;padding:5px 10px;border:1px solid var(--line)} .flag.off{color:var(--sub);opacity:.55}
  .panel .x{position:absolute;top:14px;right:16px;cursor:pointer;opacity:.6;font-size:18px} .panel .x:hover{opacity:1}
  .warnbox{background:rgba(255,69,58,.1);border:1px solid rgba(255,69,58,.35);border-radius:12px;padding:11px 12px;color:#ffb4ae;font-size:12.5px;line-height:1.5}
  .hint{position:absolute;right:14px;bottom:14px;z-index:3;color:var(--sub);font-size:12px;background:var(--glass);border:1px solid var(--line);border-radius:11px;padding:8px 12px;backdrop-filter:blur(10px)}
  .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);z-index:2}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>Peta Aplikasi · Dewinst.id</b><span>klik node untuk telusuri · dikelompokkan per menu sidebar</span></div>
    <div class="stats">
      <div class="stat"><b id="s-mod">0</b><span>aksi</span></div>
      <div class="stat"><b id="s-tab">0</b><span>data</span></div>
      <div class="stat"><b id="s-edge">0</b><span>koneksi</span></div>
    </div>
    <div class="grow"></div>
    <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="q" placeholder="Cari…" autocomplete="off"/></div>
    <button class="btn" id="reset">Reset</button>
  </header>
  <main>
    <div class="floatbar" id="presets"></div>
    <div class="steps" id="steps"></div>
    <div id="cy"></div>
    <div class="loading" id="loading">Memuat…</div>
    <div class="legend" id="legend"><h4>Workspace (klik untuk sembunyikan)</h4></div>
    <div class="panel" id="panel">
      <div class="x" id="px">✕</div>
      <div class="ph"><span class="tag" id="p-tag">—</span><h3 id="p-title">—</h3><div class="kind" id="p-kind">—</div></div>
      <div class="pb" id="p-body"></div>
    </div>
    <div class="hint">scroll = zoom · drag = geser · klik kotak workspace = sorot grup</div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script>
// ===== Workspaces (persis dari sidebar) — urut alur kiri→kanan =====
const WS=[
  ['master','Master Data','#98989d'],
  ['pembelian','Pembelian','#30d158'],
  ['gudang','Gudang','#ff9f0a'],
  ['penjualan','Penjualan','#0a84ff'],
  ['kasbank','Kas & Bank','#64d2ff'],
  ['bukubesar','Buku Besar','#ffd60a'],
  ['laporan','Laporan','#bf5af2'],
];
const WSC=Object.fromEntries(WS.map(w=>[w[0],w[2]]));
const WSL=Object.fromEntries(WS.map(w=>[w[0],w[1]]));

// ===== Nodes: [id, label, kind(action|table|report), workspace, deskripsi MANUSIAWI] =====
const N=[
  // Master Data
  ['suppliers','Supplier','table','master','Daftar pemasok tempat kamu kulakan barang. Dipakai saat bikin PO.'],
  ['customers','Customer','table','master','Daftar pelangganmu. Dipakai saat jualan / bikin invoice.'],
  // Pembelian
  ['po','Purchase Order','action','pembelian','Bikin pesanan beli ke supplier. Ini baru rencana — belum nyentuh stok atau uang.'],
  ['receive','Penerimaan Barang','action','pembelian','Barang dari supplier datang. Sekali proses: stok naik, HPP dihitung ulang, faktur dibuat, dan kalau PO-nya cash/DP, pembayaran vendor otomatis jalan.'],
  ['purchase_invoices','Faktur Pembelian','table','pembelian','Tagihan dari vendor — ini hutangmu. Muncul di "Bayar Vendor" dan masuk laporan.'],
  ['vendor_payments','Bayar Vendor','table','pembelian','Catatan uang yang kamu bayarkan ke vendor untuk melunasi faktur.'],
  // Gudang
  ['products','Inventori (produk)','table','gudang','Master barang. Jumlah & HPP-nya berubah otomatis tiap kali kamu beli, jual, atau opname.'],
  ['inbound','Barang Masuk (scan)','action','gudang','Scan barcode untuk nambah stok cepat tanpa lewat PO.'],
  ['opname','Stock Opname','action','gudang','Hitung fisik stok. Kalau ada selisih, sistem buatkan penyesuaian stok + jurnalnya.'],
  ['outbound','Packing / Outbound','action','gudang','Scan barang yang mau dikirim (order online). Stok berkurang.'],
  ['returns','Retur','action','gudang','Terima retur atau tukar size dari pelanggan. Stok ikut disesuaikan.'],
  ['packing_sessions','Sesi Packing','table','gudang','Catatan tiap pengiriman. Ini yang jadi isi halaman "Terjual".'],
  ['stock_movements','Kartu Stok','table','gudang','Buku besar barang — semua masuk/keluar tercatat di sini. Muara semua pergerakan stok.'],
  // Penjualan
  ['pos','POS Kasir','action','penjualan','Jualan langsung di kasir: pilih barang → bayar → struk. Sekali klik beres semua (stok, uang, jurnal).'],
  ['invoice','Invoice Penjualan','action','penjualan','Buat faktur penjualan manual, misalnya transaksi via WA/transfer.'],
  ['import_mp','Import Marketplace','action','penjualan','Tarik order dari Shopee/TikTok jadi penjualan di sistem.'],
  ['orders','Order Masuk','report','penjualan','Daftar order yang perlu diproses & dipacking.'],
  ['sales_invoices','Faktur Jual','table','penjualan','Semua faktur penjualan (piutang). Sumber utama Laporan Keuangan & Reports.'],
  ['customer_payments','Penerimaan Kas','table','penjualan','Uang masuk dari pelanggan, dialokasikan untuk melunasi invoice.'],
  ['terjual','Halaman Terjual','report','penjualan','Riwayat barang yang DIKIRIM (dari packing). ⚠️ Bukan semua penjualan — POS tidak muncul di sini.'],
  // Kas & Bank
  ['bank_accounts','Akun Bank / Kas','table','kasbank','Daftar kas & rekening. Saldonya naik/turun otomatis tiap ada pembayaran.'],
  ['expense','Pengeluaran / Beban','action','kasbank','Catat biaya operasional (gaji, sewa, iklan, packing, dll) lengkap dengan bukti.'],
  ['bank_transactions','Semua Mutasi','table','kasbank','Riwayat uang masuk & keluar tiap akun. Jadi dasar rekonsiliasi.'],
  ['reconcile','Rekonsiliasi','action','kasbank','Cocokkan mutasi di sistem dengan rekening koran bank asli.'],
  // Buku Besar
  ['coa','Chart of Accounts','table','bukubesar','Daftar akun akuntansi (Kas, Piutang, HPP, dst). Fondasi yang dirujuk semua jurnal.'],
  ['journal_entries','Jurnal / Buku Besar','table','bukubesar','Muara semua transaksi akuntansi. Tiap jual/beli/bayar otomatis bikin jurnal di sini.'],
  ['periode','Tutup Buku','action','bukubesar','Kunci bulan yang sudah selesai supaya transaksinya tidak bisa diubah lagi.'],
  // Laporan
  ['lap_keuangan','Laporan Keuangan','report','laporan','Neraca, Laba-Rugi, Arus Kas, Perubahan Ekuitas — semuanya dari jurnal.'],
  ['reports_ops','Laporan Operasional','report','laporan','Profit, penjualan per channel, retur, dan stok yang lambat laku.'],
];
const META=Object.fromEntries(N.map(n=>[n[0],{label:n[1],kind:n[2],ws:n[3],desc:n[4]}]));

// ===== Edges [from, to, type] =====
const E=[
  ['suppliers','po','write'],['products','po','write'],
  ['po','receive','write'],
  ['receive','products','stock'],['receive','stock_movements','stock'],
  ['receive','purchase_invoices','write'],['purchase_invoices','journal_entries','journal'],
  ['receive','vendor_payments','money'],['vendor_payments','bank_accounts','money'],['vendor_payments','bank_transactions','money'],['vendor_payments','journal_entries','journal'],

  ['inbound','products','stock'],['inbound','stock_movements','stock'],
  ['opname','products','stock'],['opname','stock_movements','stock'],['opname','journal_entries','journal'],
  ['outbound','packing_sessions','fulfil'],['outbound','stock_movements','stock'],
  ['returns','packing_sessions','fulfil'],['returns','stock_movements','stock'],
  ['packing_sessions','terjual','fulfil'],['packing_sessions','orders','fulfil'],

  ['products','pos','write'],['products','invoice','write'],['products','import_mp','write'],['customers','pos','write'],
  ['pos','sales_invoices','write'],['invoice','sales_invoices','write'],['import_mp','sales_invoices','write'],
  ['sales_invoices','stock_movements','stock'],['sales_invoices','journal_entries','journal'],
  ['pos','customer_payments','money'],['customer_payments','sales_invoices','write'],
  ['customer_payments','bank_accounts','money'],['customer_payments','bank_transactions','money'],['customer_payments','journal_entries','journal'],
  ['sales_invoices','reports_ops','report'],

  ['expense','journal_entries','journal'],['expense','bank_transactions','money'],['expense','bank_accounts','money'],
  ['bank_accounts','bank_transactions','money'],['reconcile','bank_transactions','write'],['expense','reports_ops','report'],

  ['coa','journal_entries','write'],['periode','journal_entries','write'],
  ['journal_entries','lap_keuangan','report'],['stock_movements','reports_ops','report'],['packing_sessions','reports_ops','report'],

  ['sales_invoices','packing_sessions','broken'],
];
const ETYPE={write:{c:'rgba(255,255,255,.32)',w:1.5,lbl:'tulis data'},stock:{c:'#30d158',w:2.1,lbl:'gerak stok'},
  journal:{c:'#ffd60a',w:2.3,lbl:'buat jurnal'},money:{c:'#64d2ff',w:2.1,lbl:'kas/bank'},
  report:{c:'#bf5af2',w:1.7,lbl:'tampil di laporan'},fulfil:{c:'#ff9f0a',w:2.1,lbl:'pengiriman'},broken:{c:'#ff453a',w:2,lbl:'TIDAK sinkron'}};
const down=id=>E.filter(e=>e[0]===id).map(e=>({to:e[1],type:e[2]}));
const up=id=>E.filter(e=>e[1]===id).map(e=>({from:e[0],type:e[2]}));

// ===== build elements with deterministic per-workspace column layout =====
const COLW=330, ROWH=86;
const byWs={}; N.forEach(n=>{(byWs[n[3]]=byWs[n[3]]||[]).push(n);});
const maxRows=Math.max(...WS.map(w=>(byWs[w[0]]||[]).length));
const els=[];
WS.forEach(w=>els.push({data:{id:'ws_'+w[0],label:w[1],isParent:true,ws:w[0]}}));
WS.forEach((w,ci)=>{
  const list=byWs[w[0]]||[]; const offset=(maxRows-list.length)/2;
  list.forEach((n,ri)=>els.push({data:{id:n[0],label:n[1],kind:n[2],ws:n[3],parent:'ws_'+w[0]},
                                 position:{x:ci*COLW,y:(ri+offset)*ROWH}}));
});
E.forEach((e,i)=>els.push({data:{id:'e'+i,source:e[0],target:e[1],etype:e[2]},classes:e[2]==='broken'?'broken':'flow'}));

const cy=cytoscape({
  container:document.getElementById('cy'), elements:els, wheelSensitivity:.25,
  style:[
    {selector:'$node > node',style:{}},
    {selector:'node[?isParent]',style:{
      'label':'data(label)','text-valign':'top','text-halign':'center','text-margin-y':-6,
      'color':e=>WSC[e.data('ws')],'font-size':13,'font-weight':700,'text-transform':'uppercase','text-max-width':260,
      'background-color':e=>WSC[e.data('ws')],'background-opacity':.05,'border-width':1.2,'border-color':e=>WSC[e.data('ws')],
      'border-opacity':.5,'shape':'round-rectangle','padding':'18px','corner-radius':18
    }},
    {selector:'node[!isParent]',style:{
      'label':'data(label)','color':'#fff','font-size':11,'font-weight':600,'text-valign':'center','text-halign':'center',
      'text-wrap':'wrap','text-max-width':128,'width':'label','height':'label','padding':'11px',
      'background-color':e=>WSC[e.data('ws')],'background-opacity':.18,'border-width':1.6,'border-color':e=>WSC[e.data('ws')],'border-opacity':.9,
      'text-outline-color':'#0a0c12','text-outline-width':1.6,
      'shape':e=>e.data('kind')==='action'?'round-rectangle':e.data('kind')==='report'?'round-hexagon':'barrel',
      'transition-property':'background-opacity,border-width,opacity','transition-duration':'160ms'
    }},
    {selector:'node[kind="action"]',style:{'font-size':12,'border-width':2.2,'background-opacity':.26}},
    {selector:'edge',style:{'curve-style':'bezier','target-arrow-shape':'triangle','arrow-scale':.85,
      'width':e=>ETYPE[e.data('etype')].w,'line-color':e=>ETYPE[e.data('etype')].c,'target-arrow-color':e=>ETYPE[e.data('etype')].c,
      'opacity':.34,'transition-property':'opacity,width','transition-duration':'160ms'}},
    {selector:'edge.flow',style:{'line-style':'dashed','line-dash-pattern':[7,7]}},
    {selector:'edge.broken',style:{'line-style':'dashed','line-dash-pattern':[3,5],'target-arrow-shape':'none','opacity':.95,
      'label':'⚠ tidak sinkron','font-size':9,'color':'#ff453a','text-rotation':'autorotate','text-background-color':'#07080c','text-background-opacity':.75,'text-background-padding':2}},
    {selector:'node.dim',style:{'opacity':.3}},
    {selector:'edge.dim',style:{'opacity':.06}},
    {selector:'node[?isParent].dim',style:{'opacity':.5}},
    {selector:'edge.lit',style:{'opacity':1,'width':e=>ETYPE[e.data('etype')].w+2.4,'underlay-color':e=>ETYPE[e.data('etype')].c,'underlay-opacity':.3,'underlay-padding':2.5}},
    {selector:'node.lit',style:{'opacity':1,'background-opacity':.62,'border-width':3,'border-opacity':1,'color':'#fff','underlay-color':e=>WSC[e.data('ws')],'underlay-opacity':.3,'underlay-padding':8}},
    {selector:'node.focus',style:{'opacity':1,'background-opacity':.9,'border-width':4,'border-color':'#fff','underlay-color':e=>WSC[e.data('ws')],'underlay-opacity':.65,'underlay-padding':15}},
    {selector:'node.step',style:{'border-color':'#fff','border-width':3}},
  ],
  layout:{name:'preset',fit:true,padding:60}
});

document.getElementById('s-mod').textContent=N.filter(n=>n[2]==='action').length;
document.getElementById('s-tab').textContent=N.filter(n=>n[2]!=='action').length;
document.getElementById('s-edge').textContent=E.length;
document.getElementById('loading').style.display='none';

// legend
const legend=document.getElementById('legend'); const hidden=new Set();
WS.forEach(w=>{ const r=document.createElement('div');r.className='row';
  r.innerHTML=`<span class="swatch" style="color:${w[2]};background:${w[2]}"></span>${w[1]}`;
  r.onclick=()=>{ r.classList.toggle('off'); hidden.has(w[0])?hidden.delete(w[0]):hidden.add(w[0]);
    cy.batch(()=>cy.nodes('[!isParent]').forEach(n=>n.style('display',hidden.has(n.data('ws'))?'none':'element'))); };
  legend.appendChild(r); });

// edge flow animation
let off=0;(function tick(){off-=0.5;cy.batch(()=>cy.edges('.flow').style('line-dash-offset',off));requestAnimationFrame(tick);})();

function clearFocus(){cy.elements().removeClass('dim lit focus');}
function focusNode(node){ clearNums(); if(node.data('isParent')){ focusWs(node.data('ws')); return; }
  const hood=node.closedNeighborhood().closedNeighborhood();
  cy.batch(()=>{cy.elements().addClass('dim');hood.removeClass('dim').addClass('lit');node.removeClass('dim').addClass('focus');});
  openPanel(node.id()); cy.animate({fit:{eles:hood,padding:90}},{duration:420,easing:'ease-in-out-cubic'});
}
function focusWs(ws){ const set=cy.nodes('[!isParent]').filter(n=>n.data('ws')===ws);
  const sub=set.union(set.connectedEdges()).union(set.parent());
  cy.batch(()=>{cy.elements().addClass('dim');sub.removeClass('dim').addClass('lit');});
  cy.animate({fit:{eles:sub,padding:80}},{duration:420}); }

const panel=document.getElementById('panel');
function openPanel(id){ const m=META[id]; if(!m)return;
  document.getElementById('p-title').textContent=m.label;
  document.getElementById('p-kind').textContent=({action:'Aksi / menu',table:'Data tersimpan',report:'Halaman lihat'})[m.kind]+' · '+WSL[m.ws];
  const tag=document.getElementById('p-tag'); tag.textContent=WSL[m.ws]; tag.style.background=WSC[m.ws]; tag.style.color=(m.ws==='bukubesar'||m.ws==='gudang')?'#241a00':'#04121f';
  const ds=down(id),us=up(id); const has=t=>ds.some(d=>d.type===t)||us.some(d=>d.type===t);
  let h=`<div class="sec"><p>${m.desc}</p></div>`;
  if(m.kind==='action') h+=`<div class="sec"><h5>Sekali klik ini, yang berubah:</h5><div class="flags">
     <span class="flag ${has('journal')?'':'off'}" style="${has('journal')?'background:#ffd60a;color:#241a00':''}">Jurnal</span>
     <span class="flag ${has('stock')?'':'off'}" style="${has('stock')?'background:#30d158;color:#04210f':''}">Stok</span>
     <span class="flag ${has('money')?'':'off'}" style="${has('money')?'background:#64d2ff;color:#04121f':''}">Kas/Bank</span></div></div>`;
  if(ds.length) h+=`<div class="sec"><h5>Mengalir ke →</h5><div class="lst">`+ds.map(d=>`<span>${META[d.to]?META[d.to].label:d.to} · ${ETYPE[d.type].lbl}</span>`).join('')+`</div></div>`;
  if(us.length) h+=`<div class="sec"><h5>← Diisi dari</h5><div class="lst">`+us.map(d=>`<span>${META[d.from]?META[d.from].label:d.from} · ${ETYPE[d.type].lbl}</span>`).join('')+`</div></div>`;
  if(['packing_sessions','terjual','sales_invoices'].includes(id)) h+=`<div class="sec"><div class="warnbox">⚠️ <b>Dua jalur terpisah:</b> pengiriman (packing → Terjual) tidak nyambung ke akuntansi (faktur jual → Laporan). Penjualan POS tidak muncul di Terjual — hati-hati salah hitung.</div></div>`;
  document.getElementById('p-body').innerHTML=h; panel.classList.add('open');
}
document.getElementById('px').onclick=()=>{panel.classList.remove('open');clearFocus();clearNums();cy.animate({fit:{eles:cy.elements(),padding:60}},{duration:360});};
cy.on('tap','node',e=>focusNode(e.target));
cy.on('tap',e=>{if(e.target===cy){panel.classList.remove('open');clearFocus();clearNums();}});
cy.on('mouseover','node[!isParent]',e=>{if(!cy.elements().hasClass('focus'))e.target.closedNeighborhood().addClass('lit');});
cy.on('mouseout','node[!isParent]',e=>{if(!cy.elements().hasClass('focus'))cy.elements().removeClass('lit');});

// ===== step numbering: label jadi "1 · Nama" saat alur dipilih =====
const ORIG=Object.fromEntries(N.map(n=>[n[0],n[1]]));
function clearNums(){cy.batch(()=>cy.nodes('[!isParent]').forEach(n=>{n.data('label',ORIG[n.id()]);n.removeClass('step');}));const st=document.getElementById('steps');if(st){st.classList.remove('show');st.innerHTML='';}}
function applyNums(ids){cy.batch(()=>ids.forEach((id,i)=>{const el=cy.getElementById(id);if(el&&el.nonempty()){el.data('label',(i+1)+' · '+ORIG[id]);el.addClass('step');}}));}

// presets — urutan array = urutan langkah alur
const PRESETS={'Semua':null,
  'Alur jualan POS':['products','pos','sales_invoices','stock_movements','customer_payments','bank_accounts','bank_transactions','journal_entries','lap_keuangan'],
  'Alur beli & terima':['suppliers','po','receive','products','stock_movements','purchase_invoices','vendor_payments','bank_accounts','bank_transactions','journal_entries'],
  'Silo pengiriman':['products','outbound','packing_sessions','orders','terjual','returns'],
  'Semua ke jurnal':['pos','receive','expense','opname','sales_invoices','purchase_invoices','customer_payments','vendor_payments','coa','journal_entries','lap_keuangan']};
const pb=document.getElementById('presets');
Object.keys(PRESETS).forEach((k,i)=>{const c=document.createElement('div');c.className='chip'+(i===0?' on':'');c.textContent=k;
  c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');
    const ids=PRESETS[k];clearFocus();clearNums();panel.classList.remove('open');
    if(!ids){cy.animate({fit:{eles:cy.elements(),padding:60}},{duration:420});return;}
    const set=cy.collection(ids.map(id=>cy.getElementById(id)));const sub=set.union(set.edgesWith(set));
    cy.batch(()=>{cy.elements().addClass('dim');sub.removeClass('dim').addClass('lit');});
    applyNums(ids);
    const st=document.getElementById('steps');
    st.innerHTML=ids.map((id,j)=>`<span class="st"><span class="num">${j+1}</span>${ORIG[id]||id}</span>`).join('<span class="arr">→</span>');
    st.classList.add('show');
    cy.animate({fit:{eles:sub,padding:90}},{duration:460,easing:'ease-in-out-cubic'});};
  pb.appendChild(c);});

document.getElementById('q').addEventListener('input',ev=>{const v=ev.target.value.trim().toLowerCase();clearNums();if(!v){clearFocus();return;}
  const hit=cy.nodes('[!isParent]').filter(n=>n.data('label').toLowerCase().includes(v)||n.id().includes(v));
  cy.batch(()=>{cy.elements().addClass('dim');hit.removeClass('dim').addClass('lit');});
  if(hit.length)cy.animate({fit:{eles:hit,padding:130}},{duration:300});});
document.getElementById('reset').onclick=()=>{document.getElementById('q').value='';
  document.querySelectorAll('.chip').forEach((x,i)=>x.classList.toggle('on',i===0));
  hidden.clear();document.querySelectorAll('.legend .row').forEach(r=>r.classList.remove('off'));
  cy.nodes('[!isParent]').style('display','element');clearFocus();clearNums();panel.classList.remove('open');
  cy.animate({fit:{eles:cy.elements(),padding:60}},{duration:420});};
</script>
</body>
